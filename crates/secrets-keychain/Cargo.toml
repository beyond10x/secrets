[package]
name = "secrets-keychain"
description = "The OS keychain as a secrets.storage backend (story:keychain-backend)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native-keychain = [
  "dep:zbus-secret-service-keyring-store",
  "dep:apple-native-keyring-store",
  "dep:windows-native-keyring-store",
]

[dependencies]
async-trait.workspace = true
keyring-core.workspace = true
secrets-core = { path = "../secrets-core" }
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", optional = true, default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
