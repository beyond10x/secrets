[package]
name = "secretsctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The platform's own credential store for the keychain backend. Without it the keychain is
# unavailable and says so.
native-keychain = ["secrets-keychain/native-keychain"]
# Test only: `SECRETSCTL_TEST_KEYCHAIN_FILE` puts the keychain backend on a file-backed
# `keyring_core::sample` store. Absent from a default build, so the variable is never read there.
test-hooks = ["keyring-core/sample"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
keyring-core.workspace = true
reqwest.workspace = true
rpassword.workspace = true
secrets-client = { path = "../secrets-client" }
secrets-core = { path = "../secrets-core" }
secrets-federation = { path = "../secrets-federation", features = ["file-config"] }
secrets-keychain = { path = "../secrets-keychain" }
secrets-remote = { path = "../secrets-remote" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "cli"
required-features = ["test-hooks"]

[lints]
workspace = true
