version: '3'

tasks:
  fmt:
    cmds: [cargo fmt --all -- --check]
  test:
    cmds:
      - cargo test --workspace --all-targets --all-features
      - cargo test --workspace --doc --all-features
  clippy:
    cmds: [cargo clippy --workspace --all-targets --all-features -- -D warnings]
  docs:
    cmds:
      - cargo doc --workspace --no-deps
      - jq -e '.openapi == "3.1.0" and .info.version == "0.4.1"' docs/openapi.json >/dev/null
  plan:
    cmds: [aep plan artifact validate]
  spec:
    cmds: [ess specify validate --path spec]
  provenance:
    cmds:
      - test "$(git grep -I -E '[/]home/[^/]+/|[g]itlab\\.' -- ':!Cargo.lock' || true)" = ""
  conformance:
    cmds: [cargo run --locked -p secrets-conformance -- check]
  docs-generate:
    desc: Regenerate the derived pages under website/docs/reference/ and website/data/ess/.
    cmds: [cargo run --locked -p secrets-docs -- generate]
  docs-check:
    desc: Fail when the generated pages are missing, stale or edited by hand.
    cmds: [cargo run --locked -p secrets-docs -- generate --check]
  website:
    desc: Build the documentation site, as the Documentation validation workflow does.
    dir: website
    cmds:
      - npm ci
      - npm run build
  check:
    deps: [fmt, test, clippy, docs, plan, spec, provenance, conformance, docs-check]
