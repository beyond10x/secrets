# Retrofitted from the shipped service at origin/main b63dcdf. Describes what the code does today.
# Sources: docs/openapi.json (OpenAPI 3.1.0, info.version 0.5.0); crates/secrets-core/src/lib.rs;
# crates/secrets-postgres/{migrations/0001_initial.sql,src/lib.rs}; crates/secrets-http/src/lib.rs;
# crates/secrets-auth/src/lib.rs; crates/secrets-app/src/main.rs.
#
# The service publishes no events: no publisher, outbox or broker exists in crates/ (searched for
# publish|outbox|nats|kafka|webhook|notify, no match). Every event below is declared only because a
# success outcome must emit one; none is in the component's `publishes:` list. The durable record
# the code does write for each is an `audit_events` row (migrations/0001_initial.sql:37-44),
# named beside each event.
domain: secrets.custody

summary: Encrypted, tenant-scoped custody of secret values, their revocation and deletion, and atomic prepared mutation batches.

types:
  # crates/secrets-core/src/lib.rs:40-45 SecretRef; docs/openapi.json #/components/schemas/Reference
  - name: secrets.custody.Reference
    kind: struct
    fields:
      - name: tenant
        type: String
      - name: namespace
        type: String
      - name: key
        type: String

  # crates/secrets-core/src/lib.rs:33-38 Disclosure, serde snake_case;
  # migrations/0001_initial.sql:7 CHECK (disclosure IN ('workload_only','user_revealable'));
  # docs/openapi.json #/components/schemas/PutSecret/properties/disclosure
  - name: secrets.custody.Disclosure
    kind: enum
    variants: [workload_only, user_revealable]

  # crates/secrets-core/src/lib.rs:47-56 PutSecret; docs/openapi.json #/components/schemas/PutSecret.
  # Named PutSecret in Rust; renamed because the command holds that name. Carried inside a
  # Mutation::Put; the HTTP PUT takes the same fields as command input.
  - name: secrets.custody.SecretWrite
    kind: struct
    fields:
      - name: reference
        type: secrets.custody.Reference
      - name: owner_subject
        type: String
      - name: value
        # SecretBytes, base64 on the wire (crates/secrets-core/src/lib.rs:9-31)
        type: Bytes
      - name: disclosure
        # #[serde(default = "workload_only")] (crates/secrets-core/src/lib.rs:52-53)
        type: Optional<secrets.custody.Disclosure>
      - name: labels
        # #[serde(default)] (crates/secrets-core/src/lib.rs:54-55)
        type: Optional<Map<String, String>>

  # Mutation::Put payload (crates/secrets-core/src/lib.rs:91)
  - name: secrets.custody.PutMutation
    kind: struct
    fields:
      - name: secret
        type: secrets.custody.SecretWrite

  # Mutation::Delete payload (crates/secrets-core/src/lib.rs:92)
  - name: secrets.custody.DeleteMutation
    kind: struct
    fields:
      - name: reference
        type: secrets.custody.Reference

  # crates/secrets-core/src/lib.rs:88-93 Mutation, #[serde(tag = "op", rename_all = "snake_case")]
  - name: secrets.custody.Mutation
    kind: union
    tag: op
    variants:
      put: secrets.custody.PutMutation
      delete: secrets.custody.DeleteMutation

entities:
  # Read from crates/secrets-core/src/lib.rs:62-73 SecretMetadata and :82-86 StoredSecret;
  # migrations/0001_initial.sql:1-14 table `secrets`; docs/openapi.json #/components/schemas/Metadata.
  # Identity: every operation addresses a secret by its reference, unique per
  # (tenant, namespace, secret_key) (migrations/0001_initial.sql:13); the row's primary key `id`
  # (migrations/0001_initial.sql:2) is kept across puts (crates/secrets-postgres/src/lib.rs:88-96)
  # and is output only.
  - name: secrets.custody.Secret
    identity:
      name: reference
      type: secrets.custody.Reference
    fields:
      - name: id
        # Uuid::now_v7 on first put (crates/secrets-postgres/src/lib.rs:95)
        type: Uuid
      - name: owner_subject
        type: String
      - name: disclosure
        type: secrets.custody.Disclosure
      - name: version
        # column current_version (migrations/0001_initial.sql:9); +1 per put
        # (crates/secrets-postgres/src/lib.rs:91-95)
        type: Integer
      - name: labels
        type: Map<String, String>
      - name: value
        # StoredSecret.value (crates/secrets-core/src/lib.rs:85); held only as AES-256-GCM
        # ciphertext of the current version in `secret_versions`
        # (crates/secrets-postgres/src/lib.rs:108-111, 163-179)
        type: Bytes
      - name: created_at
        # Postgres `created_at::text`, not RFC 3339 (crates/secrets-postgres/src/lib.rs:121)
        type: String
      - name: updated_at
        type: String
    invariants:
      # CHECK (current_version > 0) (migrations/0001_initial.sql:9)
      - version > 0
    # `secret_versions` rows are owned (FOREIGN KEY ... ON DELETE CASCADE,
    # migrations/0001_initial.sql:17) under the composite (secret_id, version)
    # (migrations/0001_initial.sql:25), and no operation reads or addresses a version.
    # DECIDED 2026-09-27: a stored version is storage behind Secret.value, not an entity of this
    # domain, so no relation is declared; a contract read of old versions would be new behaviour.
    lifecycle:
      # wire values `active` / `revoked`: crates/secrets-core/src/lib.rs:75-80 SecretState;
      # migrations/0001_initial.sql:8; docs/openapi.json #/components/schemas/Metadata/properties/state
      initial: Active
      states: [Active, Revoked]
      terminal: []
      transitions:
        # UPDATE ... SET state='revoked' with no state filter (crates/secrets-postgres/src/lib.rs:201)
        - name: revoke
          from: [Active, Revoked]
          to: Revoked
        # upsert sets state='active' and a new version whatever the prior state
        # (crates/secrets-postgres/src/lib.rs:104)
        - name: replace
          from: [Active, Revoked]
          to: Active

  # Read from table `prepared_transactions` (migrations/0001_initial.sql, reshaped by
  # migrations/0002_prepared_batch_envelope.sql) and crates/secrets-postgres/src/lib.rs `prepare`,
  # `commit`, `abort`. No status column: a row exists only while prepared; commit and abort delete
  # it, prepare and commit delete every expired row of the tenant, and rewrap deletes every expired row.
  # The batch is held only as an AES-256-GCM envelope from the service keyring, as a secret version
  # is: a fresh data key wrapped by the active key, with associated data distinct from a secret
  # version's that binds the tenant, the transaction id and the actor. A row whose tenant, id or
  # actor differs from what it was sealed under fails to open. A batch expires 600 seconds after it
  # is prepared. The expiry is sealed inside the envelope with the mutations and copied to the
  # `expires_at` column; a batch past either is expired, so rewriting the column revives nothing.
  # An expired batch cannot be committed. Abort opens nothing: it decides on the `expires_at` column
  # alone, not the sealed expiry, and answers not-found once the column has passed or when the
  # batch is sealed under a key the keyring does not hold.
  - name: secrets.custody.PreparedTransaction
    identity:
      # The primary key is (tenant, id) (migrations/0001_initial.sql:34), so one transaction id may
      # be prepared once per tenant. Declared as the caller-chosen id.
      # ESS-LIMIT: `instance:` names an input field, and the tenant half of the key is the verified
      # caller's, not input (see PrepareTransaction); ESS 0.36 has no caller-context value to
      # compose an identity from, so a struct identity {tenant, transaction} could not be instanced.
      name: transaction
      type: Uuid
    fields:
      - name: tenant
        type: String
      - name: actor
        # caller-supplied body field, not the verified principal (crates/secrets-http/src/lib.rs:106-109, 279)
        type: String
      - name: mutations
        # held only as the batch envelope (columns ciphertext, value_nonce, wrapped_key, wrap_nonce,
        # key_id); never stored in plaintext
        type: List<secrets.custody.Mutation>
      - name: created_at
        type: String
      - name: expires_at
        # the unix second the service sealed into the envelope: its clock at prepare + 600 seconds
        type: String
    # Mutations name secrets by reference inside the sealed batch, with no foreign key, so deleting
    # a secret leaves a prepared batch in place (a `references` reading).
    # ESS-LIMIT: a relation's `via` names one field; ESS 0.52.0 has no relation form over the
    # references inside a List of union payloads (Mutation.put.secret.reference,
    # Mutation.delete.reference).
    # No route reads a prepared transaction (crates/secrets-http/src/lib.rs:38-62), so no view is
    # declared and `tenant`, `actor` and `mutations` are observable only through what commit
    # applies. The specification-level mutation audit (2026-09-27) found that dropping any of the
    # three `sets` entries on PrepareTransaction.prepared changes no synthesized scenario.
    # DECIDED 2026-09-27: a read of a prepared batch is not part of the contract; the batch is
    # sealed so that nothing but commit reads it, and a view would disclose it.
    lifecycle:
      # Structural, not read from the code: the table has no status, so one state that is both
      # initial and terminal.
      initial: Prepared
      states: [Prepared]
      terminal: [Prepared]

# audit_events (migrations/0001_initial.sql:37-44; written by crates/secrets-postgres/src/lib.rs
# `audit` with actions put, revoke, delete, commit_batch, rewrap). No operation reads it and
# secret_id has no foreign key, so rows outlive the secret. Not declared as an entity.
# DEFERRED: story:verified-audit-actor, whose `contracts/custody/scenarios/audit` set is the first to
# assert audit records and so decides how the domain declares them.

actors:
  # Identity authority: GET <origin>/v1/access-authority, exact audience, scope split into actions
  # (crates/secrets-auth/src/lib.rs:32-92). Action per command: crates/secrets-http/src/lib.rs:115-173.
  - name: secrets.custody.User
    may:
      - secrets.custody.RevokeOwnedSecret
      - secrets.custody.DeleteOwnedSecret

  # Kubernetes authority: TokenReview for an exact audience, then the first grant whose subject
  # equals the service-account username supplies tenant and actions
  # (crates/secrets-auth/src/lib.rs:94-254). Actions: crates/secrets-http/src/lib.rs:176-302.
  - name: secrets.custody.Workload
    may:
      - secrets.custody.PutSecret
      - secrets.custody.DeleteSecret
      - secrets.custody.PrepareTransaction
      - secrets.custody.CommitTransaction
      - secrets.custody.AbortTransaction
      - secrets.custody.ReadSecretValue
      - secrets.custody.CheckSecretExists
      - secrets.custody.ListNamespaceSecrets

  # `secrets rewrap` runs with database and keyring access and no authority check
  # (crates/secrets-app/src/main.rs:31-37, 68-73).
  - name: secrets.custody.Operator
    may:
      - secrets.custody.RewrapSecrets

# Refusal and its status mapping: crates/secrets-http/src/lib.rs:361-423 (the `refusals!` catalogue), 425-445 (store and authority errors).
# Every refusal body is exactly {"error": <status reason phrase>, "code": <code>}
# (crates/secrets-http/src/lib.rs:447-459), where the code is the name of the refusal outcome below
# that answered it: two outcomes of one error, such as `forbidden` and `missing-action`, carry
# distinct codes, so a client tells them apart from the response alone. Neither member carries any
# part of the request. The codes are declared in docs/openapi.json #/components/schemas/Error, and
# checks/conformance/tests/adversary_w2.rs holds the router's codes equal to this file's refusal
# outcome names, apart from the two routing refusals `route-not-found` (404, no route has the
# path) and `method-not-allowed` (405), which the router answers before any command is chosen
# (crates/secrets-http/src/lib.rs:60-61) and which no outcome may reuse.
errors:
  - name: secrets.custody.Unauthorized
    summary: 401. No bearer token, or the authority refused it; code `unauthorized` (crates/secrets-http/src/lib.rs:340-345, 439-444).

  - name: secrets.custody.Forbidden
    summary: 403. The principal lacks the action (code `missing-action`), or its tenant differs from the addressed tenant (code `forbidden`) (crates/secrets-http/src/lib.rs:346-358).

  - name: secrets.custody.NotFound
    summary: 404. No record at the address (code `not-found`), on user routes no secret the caller owns (code `not-owned`), or a commit whose Delete names no secret (code `delete-target-missing`) (crates/secrets-http/src/lib.rs:308-324, 425-430; crates/secrets-postgres/src/lib.rs:352-360).

  - name: secrets.custody.Conflict
    summary: 409. A prepared transaction already exists for this tenant and id; code `duplicate` (crates/secrets-postgres/src/lib.rs:305-311; crates/secrets-http/src/lib.rs:431).

  - name: secrets.custody.InvalidInput
    summary: 400. A store input rule (codes `malformed-reference`, `invalid-reference`, `empty-batch`, `cross-tenant-batch`), a body that does not parse (`malformed-body`) or a path that does not parse (`malformed-path`) (crates/secrets-http/src/lib.rs:432-435, 485, 501).

  - name: secrets.custody.Unavailable
    summary: 503. Storage, crypto or authority unavailable; code `unavailable` (crates/secrets-http/src/lib.rs:436, 442).

  - name: secrets.custody.PayloadTooLarge
    summary: 413. The request body exceeds 1 MiB (RequestBodyLimitLayer, crates/secrets-http/src/lib.rs:57); refused before the handler authenticates, by the layer from the declared length or by `JsonBody` from the bytes read, and answered in the refusal shape with code `too-large` (crates/secrets-http/src/lib.rs:59-60, 461-469, 482-484).

# A JSON body that does not parse into the handler's request type (syntax, missing field, wrong
# type, content type) is refused by `JsonBody` before the handler authenticates: 400 with
# {"error": "Bad Request", "code": "malformed-body"} and no part of the input
# (crates/secrets-http/src/lib.rs:471-488). Declared as the `unparsable-body` group below. A path
# parameter that does not parse is refused the same way by `PathParams`, as `malformed-path`
# (crates/secrets-http/src/lib.rs:490-503): the `unparsable-path` group.

commands:
  # PUT /v1/workload/secrets (crates/secrets-http/src/lib.rs:46, 176-201;
  # docs/openapi.json #/paths/~1v1~1workload~1secrets/put). Workload action `secret:write`.
  - name: secrets.custody.PutSecret
    input:
      - name: reference
        type: secrets.custody.Reference
      - name: owner_subject
        # An empty owner_subject is replaced by the principal's subject
        # (crates/secrets-http/src/lib.rs:192-198).
        # ESS-LIMIT: no conditional source on a caller-context value. The ess/14 fallback
        # `{input: <field>, else: {generated: true}}` needs an Optional input and a minted value; this
        # is a required String falling back to the verified caller's subject.
        type: String
      - name: value
        type: Bytes
      - name: disclosure
        type: Optional<secrets.custody.Disclosure>
      - name: labels
        type: Optional<Map<String, String>>
    # 200 Json<SecretMetadata> (crates/secrets-http/src/lib.rs:176-201 at cb10810; docs/http-api.md:73),
    # the metadata of the row after the write; never a value.
    response: &metadata_response
      - name: id
        type: Uuid
      - name: reference
        type: secrets.custody.Reference
      - name: owner_subject
        type: String
      - name: disclosure
        type: secrets.custody.Disclosure
      - name: state
        type: secrets.custody.Secret.State
      - name: version
        type: Integer
      - name: labels
        type: Map<String, String>
      - name: created_at
        type: String
      - name: updated_at
        type: String
    outcomes:
      # No row at the reference: INSERT, version 1, state active (crates/secrets-postgres/src/lib.rs:95, 104-112)
      - name: created
        external: no secret is stored at the reference
        creates: secrets.custody.Secret
        instance: reference
        sets:
          owner_subject: input.owner_subject
          value: input.value
          # INSERT binds disclosure and labels (crates/secrets-postgres/src/lib.rs:101-106)
          disclosure: input.disclosure
          labels: input.labels
          # version 1 on first put (crates/secrets-postgres/src/lib.rs:139 at cb10810)
          version: 1
          # Uuid::now_v7 on first put (crates/secrets-postgres/src/lib.rs:139 at cb10810)
          id: {generated: true}
          # column defaults now() (migrations/0001_initial.sql:11-12)
          created_at: {generated: true}
          updated_at: {generated: true}

        emits:
          - secrets.custody.SecretPut
        payload:
          secrets.custody.SecretPut:
            reference: input.reference
            owner_subject: input.owner_subject
        summary: A secret exists at the reference, Active, version 1.

      # Row exists: ON CONFLICT DO UPDATE, version + 1, state reset to active, new version row
      # appended; older version rows are kept (crates/secrets-postgres/src/lib.rs:85-111)
      - name: replaced
        moves: secrets.custody.Secret.replace
        instance: reference
        sets:
          owner_subject: input.owner_subject
          value: input.value
          # ON CONFLICT DO UPDATE SET disclosure=EXCLUDED.disclosure, labels=EXCLUDED.labels
          # (crates/secrets-postgres/src/lib.rs:104)
          disclosure: input.disclosure
          labels: input.labels
          # current_version + 1 (crates/secrets-postgres/src/lib.rs:133-138 at cb10810)
          version: {increment: 1}
          # ON CONFLICT DO UPDATE ... updated_at=now(); id and created_at are kept
          # (crates/secrets-postgres/src/lib.rs:149 at cb10810)
          updated_at: {generated: true}
        emits:
          - secrets.custody.SecretPut
        payload:
          secrets.custody.SecretPut:
            reference: input.reference
            owner_subject: input.owner_subject
        summary: The secret holds a new current version and is Active again, including after a revoke.

      # validate_ref refuses a reference with an empty or NUL-bearing part, in any part, as
      # `malformed-reference`, and otherwise one with a part over 255 bytes as `invalid-reference`;
      # each answers its own code (crates/secrets-postgres/src/lib.rs:129, 441-456). Empty and NUL
      # are guards.
      - name: malformed-reference
        when:
          any:
            - reference.tenant.count == 0
            - reference.namespace.count == 0
            - reference.key.count == 0
            - reference.tenant: {contains: "\0"}
            - reference.namespace: {contains: "\0"}
            - reference.key: {contains: "\0"}
        error: secrets.custody.InvalidInput

      # The length rule counts bytes, `value.len() > 255` (crates/secrets-postgres/src/lib.rs:439),
      # and `.count` counts Unicode scalar values, so the rule is external. A part over 255 bytes has
      # more than 63 characters (UTF-8 encodes one in at most 4 bytes): that is the eligibility. Its
      # first term implies the others and is listed first only so synthesis witnesses the refusal
      # with a 256-character ASCII key; it adds nothing to the condition.
      - name: invalid-reference
        external: a reference part is longer than 255 bytes
        when:
          any:
            - reference.key.count >= 256
            - reference.tenant.count > 63
            - reference.namespace.count > 63
            - reference.key.count > 63
        error: secrets.custody.InvalidInput

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the grant's tenant is not reference.tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:write, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage, encryption or TokenReview is unavailable
        error: secrets.custody.Unavailable

  # POST /v1/user/secrets:revoke (crates/secrets-http/src/lib.rs:44, 143-159;
  # docs/openapi.json #/paths/~1v1~1user~1secrets:revoke/post). User action `secret:revoke`,
  # plus assert_owner: owner_subject must equal the caller (crates/secrets-http/src/lib.rs:155, 304-320).
  - name: secrets.custody.RevokeOwnedSecret
    input:
      - name: reference
        type: secrets.custody.Reference
    # 200 Json<SecretMetadata> with state revoked (crates/secrets-http/src/lib.rs:143-159 at cb10810;
    # docs/http-api.md:64).
    response: *metadata_response
    outcomes:
      # Revoke from Revoked succeeds again and appends another audit row (crates/secrets-postgres/src/lib.rs:201-204)
      - name: revoked
        moves: secrets.custody.Secret.revoke
        instance: reference
        sets:
          # UPDATE secrets SET state='revoked',updated_at=now() (crates/secrets-postgres/src/lib.rs:246 at cb10810)
          updated_at: {generated: true}
        emits:
          - secrets.custody.SecretRevoked
        payload:
          secrets.custody.SecretRevoked:
            reference: input.reference
        summary: The secret is Revoked; workload get and exists no longer see it, list and detail still do.

      # The ownership rule reads the stored owner_subject against the caller
      # (crates/secrets-http/src/lib.rs:308-324); declared external.
      # ESS-LIMIT: a stored-field guard compares a stored field with input; ESS 0.36 has no
      # caller-context value (the verified subject) for a `when` to compare it with.
      - name: not-owned
        external: no secret at the reference is owned by the calling subject
        error: secrets.custody.NotFound

      - name: unauthorized
        external: the bearer token is missing or refused by the Identity authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the caller's tenant is not reference.tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the scope lacks secret:revoke, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or the Identity authority is unavailable
        error: secrets.custody.Unavailable

  # DELETE /v1/user/secrets (crates/secrets-http/src/lib.rs:45, 160-175;
  # docs/openapi.json #/paths/~1v1~1user~1secrets/delete). User action `secret:delete` plus assert_owner.
  - name: secrets.custody.DeleteOwnedSecret
    input:
      - name: reference
        type: secrets.custody.Reference
    outcomes:
      # DELETE FROM secrets, cascading every version row (crates/secrets-postgres/src/lib.rs:133-144;
      # migrations/0001_initial.sql:17). Allowed from Active and Revoked.
      - name: deleted
        deletes: secrets.custody.Secret
        instance: reference
        emits:
          - secrets.custody.SecretDeleted
        payload:
          secrets.custody.SecretDeleted:
            reference: input.reference
        summary: The secret and all its encrypted versions are gone.

      - name: not-owned
        external: no secret at the reference is owned by the calling subject
        error: secrets.custody.NotFound

      - name: unauthorized
        external: the bearer token is missing or refused by the Identity authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the caller's tenant is not reference.tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the scope lacks secret:delete, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or the Identity authority is unavailable
        error: secrets.custody.Unavailable

  # POST /v1/workload/secrets:delete (crates/secrets-http/src/lib.rs:50, 248-268;
  # docs/openapi.json #/paths/~1v1~1workload~1secrets:delete/post). Workload action `secret:delete`;
  # no ownership check. Body DeleteRequest (crates/secrets-http/src/lib.rs:99-104).
  - name: secrets.custody.DeleteSecret
    input:
      - name: reference
        type: secrets.custody.Reference
      - name: actor
        # recorded as the audit actor instead of the principal when present (crates/secrets-http/src/lib.rs:264)
        type: Optional<String>
    outcomes:
      - name: deleted
        deletes: secrets.custody.Secret
        instance: reference
        emits:
          - secrets.custody.SecretDeleted
        payload:
          secrets.custody.SecretDeleted:
            reference: input.reference
        summary: The secret and all its encrypted versions are gone.

      - name: not-found
        external: no secret is stored at the reference
        error: secrets.custody.NotFound

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the grant's tenant is not reference.tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:delete, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or TokenReview is unavailable
        error: secrets.custody.Unavailable

  # PUT /v1/workload/tenants/{tenant}/transactions/{transaction} (crates/secrets-http/src/lib.rs:51-54, 269-282;
  # crates/secrets-postgres/src/lib.rs:265-312). Workload action `secret:prepare`.
  # Body PrepareRequest {actor, mutations} (crates/secrets-http/src/lib.rs:105-109).
  #
  # The path tenant is not an input. The handler refuses a path tenant that is not the verified
  # principal's (tenant_match, crates/secrets-http/src/lib.rs:276, 347-353), so every batch that
  # reaches the store is prepared in the caller's tenant, and the store's tenant rule compares each
  # mutation with that tenant (crates/secrets-postgres/src/lib.rs:275-283). The caller is outside
  # the input, so that rule is `cross-tenant-batch`, external. Modelled this way because ESS 0.36
  # cannot witness the input form: a guard comparing a mutation's tenant with a `tenant` input is
  # accepted by `ess specify validate`, but synthesis finds no candidate for the equality and refuses
  # `prepared`, `duplicate` and `unavailable` (ESS-SYNTH-003).
  - name: secrets.custody.PrepareTransaction
    input:
      - name: transaction
        type: Uuid
      - name: actor
        type: String
      - name: mutations
        type: List<secrets.custody.Mutation>
    outcomes:
      # Stored only; no secret changes until commit. References are not validated here
      # (crates/secrets-postgres/src/lib.rs:272-283 checks emptiness and tenant only).
      - name: prepared
        creates: secrets.custody.PreparedTransaction
        instance: transaction
        sets:
          # the caller's tenant (see above)
          tenant: {generated: true}
          actor: input.actor
          mutations: input.mutations
        emits:
          - secrets.custody.TransactionPrepared
        payload:
          secrets.custody.TransactionPrepared:
            tenant: {generated: true}
            transaction: input.transaction
        summary: The batch is held in the caller's tenant for later commit or abort, only as an AES-256-GCM envelope from the service keyring bound to the tenant, the transaction id and the actor, and for at most 600 seconds; expired batches of the tenant are removed.

      # StoreError::Invalid(InvalidInput::EmptyBatch) (crates/secrets-postgres/src/lib.rs:271-273).
      - name: empty-batch
        when: mutations.count == 0
        error: secrets.custody.InvalidInput

      # StoreError::Invalid(InvalidInput::CrossTenantBatch) (crates/secrets-postgres/src/lib.rs:274-282).
      - name: cross-tenant-batch
        external: a mutation names a tenant other than the caller's
        when: mutations.count > 0
        error: secrets.custody.InvalidInput

      # The unique key and the database are reached only after the emptiness and tenant checks
      # (crates/secrets-postgres/src/lib.rs:272-311), so both are eligible only for a non-empty batch.
      - name: duplicate
        external: a transaction with this id is already prepared in the tenant
        when: mutations.count > 0
        error: secrets.custody.Conflict

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the path names a tenant other than the grant's
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:prepare, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or TokenReview is unavailable
        when: mutations.count > 0
        error: secrets.custody.Unavailable

  # POST .../transactions/{transaction}/commit (crates/secrets-http/src/lib.rs:19-20, 55, 283-292;
  # crates/secrets-postgres/src/lib.rs:260-287). Workload action `secret:commit`.
  - name: secrets.custody.CommitTransaction
    input:
      - name: tenant
        type: String
      - name: transaction
        type: Uuid
    outcomes:
      # One Postgres transaction: delete the prepared row, apply each Put (as PutSecret) and Delete
      # (as DeleteSecret) under the stored actor, audit commit_batch.
      # ESS-LIMIT: the outcome also changes the Secrets the batch names. `affects:` selects records
      # by a filter over stored fields, and these are named only inside the sealed mutation list,
      # which no filter reaches (ESS 0.52.0).
      - name: committed
        deletes: secrets.custody.PreparedTransaction
        instance: transaction
        emits:
          - secrets.custody.TransactionCommitted
        payload:
          secrets.custody.TransactionCommitted:
            tenant: input.tenant
            transaction: input.transaction
        summary: Every mutation in the batch is applied atomically and the batch is gone.

      # Expired batches of the tenant are removed before the lookup, so an expired batch is gone.
      - name: not-found
        external: no unexpired transaction with this id is prepared in the tenant; a batch expires 600 seconds after it is prepared, by its `expires_at` or by the expiry sealed in its envelope
        error: secrets.custody.NotFound

      # A Delete of a reference with no secret rolls the whole commit back, leaving the batch
      # prepared, and answers its own code (crates/secrets-postgres/src/lib.rs:352-360).
      - name: delete-target-missing
        external: a Delete mutation names a reference with no secret
        error: secrets.custody.NotFound

      # validate_ref runs only at commit, inside put_tx (crates/secrets-postgres/src/lib.rs:129,
      # 441-456), with the two codes PutSecret answers.
      - name: malformed-reference
        external: a Put mutation's reference part is empty or contains NUL
        error: secrets.custody.InvalidInput

      - name: invalid-reference
        external: a Put mutation's reference part is longer than 255 bytes, and none is empty or contains NUL
        error: secrets.custody.InvalidInput

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the grant's tenant is not the path tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:commit, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      # Nothing is applied when the batch envelope does not open.
      - name: unavailable
        external: storage, encryption or TokenReview is unavailable, or the batch envelope does not open under its tenant, id and actor
        error: secrets.custody.Unavailable

  # POST .../transactions/{transaction}/abort (crates/secrets-http/src/lib.rs:21-22, 56, 293-302;
  # crates/secrets-postgres/src/lib.rs:289-302). Workload action `secret:abort`.
  - name: secrets.custody.AbortTransaction
    input:
      - name: tenant
        type: String
      - name: transaction
        type: Uuid
    outcomes:
      # Deletes the PreparedTransaction row. No audit row is written.
      - name: aborted
        deletes: secrets.custody.PreparedTransaction
        instance: transaction
        emits:
          - secrets.custody.TransactionAborted
        payload:
          secrets.custody.TransactionAborted:
            tenant: input.tenant
            transaction: input.transaction
        summary: The batch is discarded without applying any mutation.

      - name: not-found
        external: no transaction with this id is prepared in the tenant, its `expires_at` column has passed, or its key is not in the keyring
        error: secrets.custody.NotFound

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the grant's tenant is not the path tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:abort, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or TokenReview is unavailable
        error: secrets.custody.Unavailable

  # `secrets rewrap --actor <name>` (crates/secrets-app/src/main.rs:20, 31-37, 68-73;
  # crates/secrets-postgres/src/lib.rs:53-96). Re-encrypts every stored version, current or older, whose
  # key_id differs from the active key, in every tenant and every state.
  # After that transaction commits, a second one deletes expired prepared batches in every tenant
  # and re-seals every unexpired batch sealed under another key under the active key, keeping its
  # expiry. No transaction locks secrets and then batches.
  - name: secrets.custody.RewrapSecrets
    input:
      - name: actor
        # default "secretsctl" (crates/secrets-app/src/main.rs:35-36)
        type: String
    outcomes:
      # ESS-LIMIT: changes many Secrets at once without moving them. `instances: {where: ...}` selects
      # by stored fields, and which versions are under another key is `secret_versions.key_id`,
      # storage behind Secret.value rather than a field (ESS 0.52.0).
      # One `rewrap` audit row per re-encrypted version (crates/secrets-postgres/src/lib.rs:93),
      # so the event exists only when some stored version was under another key; which versions
      # are is stored state, not input.
      # ESS-LIMIT: that every stored version, not only the current one, is rewrapped is not
      # observable here: no view reads a version, and `expect_event` matches an event by name, so
      # one SecretsRewrapped satisfies any number of expected ones (ESS 0.52.0,
      # ess-conformance runner.rs `expect_event`). Guarded by
      # crates/secrets-postgres/tests/lifecycle.rs `rewrap_reencrypts_every_stored_version`.
      - name: rewrapped
        external: at least one stored version is wrapped by a key other than the operator's active key
        emits:
          - secrets.custody.SecretsRewrapped
        payload:
          secrets.custody.SecretsRewrapped:
            actor: input.actor
        summary: Every stored version and every held prepared batch is wrapped by the active key.

      # The SELECT finds no row (crates/secrets-postgres/src/lib.rs:55-57), so no version is rewritten
      # and no audit row is written; held batches are still resealed (crates/secrets-postgres/src/lib.rs:96).
      # The only record is the command's own output, `rewrapped 0 version(s)` (crates/secrets-app/src/main.rs:70-73).
      - name: nothing-to-rewrap
        emits:
          - secrets.custody.NothingRewrapped
        payload:
          secrets.custody.NothingRewrapped:
            actor: input.actor
        summary: Every stored version was already wrapped by the active key; nothing is re-encrypted and nothing is recorded.

      - name: failed
        external: storage is unavailable, or a stored version or a held batch does not decrypt with the keyring
        error: secrets.custody.Unavailable

  # POST /v1/workload/secrets:get (crates/secrets-http/src/lib.rs:47, 202-215;
  # crates/secrets-postgres/src/lib.rs:207-228) as a command, so its refusals are declared: a
  # principal of another tenant, or one lacking `secret:read_value`, is refused before the store is
  # read and the refusal carries only its reason (crates/secrets-http/src/lib.rs:321-353, 374-393).
  # The value it returns is the SecretValue view.
  - name: secrets.custody.ReadSecretValue
    input:
      - name: reference
        type: secrets.custody.Reference
    outcomes:
      - name: read
        emits:
          - secrets.custody.SecretValueRead
        payload:
          secrets.custody.SecretValueRead:
            reference: input.reference
        summary: The caller receives the current version's value and metadata.

      # get filters on state='active' (crates/secrets-postgres/src/lib.rs:208), so a revoked secret is
      # not found either.
      - name: not-found
        external: no Active secret is stored at the reference
        error: secrets.custody.NotFound

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the grant's tenant is not reference.tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:read_value, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage, decryption or TokenReview is unavailable
        error: secrets.custody.Unavailable

  # POST /v1/workload/secrets:exists (crates/secrets-http/src/lib.rs:48, 216-231;
  # crates/secrets-postgres/src/lib.rs:228-232) as a command, for its refusals. The answer is the
  # ActiveSecrets view.
  - name: secrets.custody.CheckSecretExists
    input:
      - name: reference
        type: secrets.custody.Reference
    outcomes:
      - name: checked
        emits:
          - secrets.custody.SecretExistenceChecked
        payload:
          secrets.custody.SecretExistenceChecked:
            reference: input.reference
        summary: The caller learns whether an Active secret is stored at the reference.

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      - name: forbidden
        external: the grant's tenant is not reference.tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:read_metadata, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or TokenReview is unavailable
        error: secrets.custody.Unavailable

  # POST /v1/workload/secrets:list (crates/secrets-http/src/lib.rs:49, 232-247) as a command, for
  # its refusals. Body ScopeRequest {tenant, namespace} (crates/secrets-http/src/lib.rs:94-98); the
  # listing is the NamespaceSecrets view.
  - name: secrets.custody.ListNamespaceSecrets
    input:
      - name: tenant
        type: String
      - name: namespace
        type: String
    outcomes:
      - name: listed
        emits:
          - secrets.custody.NamespaceSecretsListed
        payload:
          secrets.custody.NamespaceSecretsListed:
            tenant: input.tenant
            namespace: input.namespace
        summary: The caller receives the metadata of every secret in the namespace, in both states.

      - name: unauthorized
        external: the bearer token is missing or refused by the Kubernetes authority
        error: secrets.custody.Unauthorized

      # tenant_match against the body tenant (crates/secrets-http/src/lib.rs:238).
      - name: forbidden
        external: the grant's tenant is not the requested tenant
        error: secrets.custody.Forbidden

      # Principal::permits (crates/secrets-auth/src/lib.rs:14-16), checked for every route before
      # its tenant (crates/secrets-http/src/lib.rs:342-344).
      - name: missing-action
        external: the grant lacks secret:list, for a principal of the addressed tenant
        error: secrets.custody.Forbidden

      - name: unavailable
        external: storage or TokenReview is unavailable
        error: secrets.custody.Unavailable

events:
  # audit action `put` (crates/secrets-postgres/src/lib.rs:112). Not published.
  - name: secrets.custody.SecretPut
    fields:
      - name: reference
        type: secrets.custody.Reference
      - name: owner_subject
        type: String

  # audit action `revoke` (crates/secrets-postgres/src/lib.rs:204). Not published.
  - name: secrets.custody.SecretRevoked
    fields:
      - name: reference
        type: secrets.custody.Reference

  # audit action `delete` (crates/secrets-postgres/src/lib.rs:144). Not published.
  - name: secrets.custody.SecretDeleted
    fields:
      - name: reference
        type: secrets.custody.Reference

  # No audit row is written at prepare (crates/secrets-postgres/src/lib.rs:220-258). Not published.
  - name: secrets.custody.TransactionPrepared
    fields:
      - name: tenant
        type: String
      - name: transaction
        type: Uuid

  # audit action `commit_batch` with secret_id NULL (crates/secrets-postgres/src/lib.rs:285),
  # after one `put`/`delete` row per mutation. Not published.
  - name: secrets.custody.TransactionCommitted
    fields:
      - name: tenant
        type: String
      - name: transaction
        type: Uuid

  # No audit row is written at abort (crates/secrets-postgres/src/lib.rs:289-302). Not published.
  - name: secrets.custody.TransactionAborted
    fields:
      - name: tenant
        type: String
      - name: transaction
        type: Uuid

  # audit action `rewrap`, one per re-encrypted version (crates/secrets-postgres/src/lib.rs:93). Not published.
  - name: secrets.custody.SecretsRewrapped
    fields:
      - name: actor
        type: String

  # `rewrapped 0 version(s)` on the command's output (crates/secrets-app/src/main.rs:70-73); no audit
  # row is written. Not published.
  - name: secrets.custody.NothingRewrapped
    fields:
      - name: actor
        type: String

  # No audit row is written for a read (crates/secrets-http/src/lib.rs:202-247). Not published.
  - name: secrets.custody.SecretValueRead
    fields:
      - name: reference
        type: secrets.custody.Reference

  # No audit row is written for a read. Not published.
  - name: secrets.custody.SecretExistenceChecked
    fields:
      - name: reference
        type: secrets.custody.Reference

  # No audit row is written for a read. Not published.
  - name: secrets.custody.NamespaceSecretsListed
    fields:
      - name: tenant
        type: String
      - name: namespace
        type: String

outcome_groups:
  # RequestBodyLimitLayer::new(1024 * 1024) wraps every route (crates/secrets-http/src/lib.rs:57);
  # these are the commands that take a JSON body. Commit, abort and rewrap take none.
  - name: body-limit
    commands:
      - secrets.custody.PutSecret
      - secrets.custody.RevokeOwnedSecret
      - secrets.custody.DeleteOwnedSecret
      - secrets.custody.DeleteSecret
      - secrets.custody.PrepareTransaction
      - secrets.custody.ReadSecretValue
      - secrets.custody.CheckSecretExists
      - secrets.custody.ListNamespaceSecrets
    outcomes:
      - name: too-large
        external: the request body is longer than 1048576 bytes
        error: secrets.custody.PayloadTooLarge

  # JsonBody (crates/secrets-http/src/lib.rs:396-415) on every route that takes a JSON body.
  # The typed input cannot carry a body that does not parse, so the condition is external.
  - name: unparsable-body
    commands:
      - secrets.custody.PutSecret
      - secrets.custody.RevokeOwnedSecret
      - secrets.custody.DeleteOwnedSecret
      - secrets.custody.DeleteSecret
      - secrets.custody.PrepareTransaction
      - secrets.custody.ReadSecretValue
      - secrets.custody.CheckSecretExists
      - secrets.custody.ListNamespaceSecrets
    outcomes:
      - name: malformed-body
        external: the request body is not JSON of the command's request shape
        error: secrets.custody.InvalidInput

  # PathParams (crates/secrets-http/src/lib.rs:490-503) on every route with a `{transaction}` path
  # segment, before the handler authenticates. The typed input carries a Uuid, so a segment that is
  # not one is outside it and the condition is external.
  - name: unparsable-path
    commands:
      - secrets.custody.PrepareTransaction
      - secrets.custody.CommitTransaction
      - secrets.custody.AbortTransaction
    outcomes:
      - name: malformed-path
        external: the transaction path segment is not a UUID
        error: secrets.custody.InvalidInput

# The disclosure and labels inputs are optional; serde fills an absent one with `workload_only` and an
# empty map (crates/secrets-core/src/lib.rs:52-60) before the store writes it.
conversions:
  - from: Optional<secrets.custody.Disclosure>
    to: secrets.custody.Disclosure
    because: >-
      An absent disclosure is `workload_only` (#[serde(default = "workload_only")],
      crates/secrets-core/src/lib.rs:52-53).
  - from: Optional<Map<String, String>>
    to: Map<String, String>
    because: >-
      Absent labels are the empty map (#[serde(default)], crates/secrets-core/src/lib.rs:54-55).

views:
  # GET /v1/user/secrets (crates/secrets-http/src/lib.rs:42, 111-121; docs/openapi.json
  # #/paths/~1v1~1user~1secrets/get). User action `secret:list`. Both states.
  # The rows are filtered to owner_subject == the caller's subject in the caller's tenant
  # (crates/secrets-http/src/lib.rs:115-125; crates/secrets-postgres/src/lib.rs:260).
  # ESS-LIMIT: a view filter can read a declared param but no caller-context value (the verified
  # subject and tenant), and the route takes no parameter.
  # This view also carries the `version > 0` invariant checks (it holds every state).
  - name: secrets.custody.OwnedSecrets
    source: secrets.custody.Secret
    consistency: read_your_writes
    fields: &metadata
      - name: id
        type: Uuid
      - name: reference
        type: secrets.custody.Reference
      - name: owner_subject
        type: String
      - name: disclosure
        type: secrets.custody.Disclosure
      - name: state
        type: secrets.custody.Secret.State
      - name: version
        type: Integer
      - name: labels
        type: Map<String, String>
      - name: created_at
        type: String
      - name: updated_at
        type: String

  # POST /v1/user/secrets:detail (crates/secrets-http/src/lib.rs:43, 122-142). User action
  # `secret:read_metadata`. Found by listing the caller's own secrets; both states.
  - name: secrets.custody.OwnedSecretDetail
    source: secrets.custody.Secret
    consistency: read_your_writes
    fields: *metadata

  # POST /v1/workload/secrets:get (crates/secrets-http/src/lib.rs:47, 202-215;
  # crates/secrets-postgres/src/lib.rs:162-181). Workload action `secret:read_value`.
  # Response is StoredSecret {metadata, value} (crates/secrets-core/src/lib.rs:82-86), flattened here.
  - name: secrets.custody.SecretValue
    source: secrets.custody.Secret
    consistency: read_your_writes
    filter: state == Active
    fields:
      - name: reference
        type: secrets.custody.Reference
      - name: version
        type: Integer
      - name: value
        type: Bytes

  # POST /v1/workload/secrets:exists (crates/secrets-http/src/lib.rs:48, 216-231;
  # crates/secrets-postgres/src/lib.rs:183-187). Workload action `secret:read_metadata`.
  # Response {exists: bool} (crates/secrets-http/src/lib.rs:90-93): true exactly for an Active row.
  - name: secrets.custody.ActiveSecrets
    source: secrets.custody.Secret
    consistency: read_your_writes
    filter: state == Active
    fields:
      - name: reference
        type: secrets.custody.Reference

  # POST /v1/workload/secrets:list (crates/secrets-http/src/lib.rs:49, 232-247). Workload action
  # `secret:list`. Body ScopeRequest {tenant, namespace} (crates/secrets-http/src/lib.rs:94-98).
  # Both states, any owner, filtered to the requested tenant and namespace
  # (crates/secrets-http/src/lib.rs:242-249).
  # ESS-LIMIT: `params: [tenant, namespace]` with `filter: [reference.tenant == param.tenant,
  # reference.namespace == param.namespace]` validates, but synthesis binds a param only to a
  # stored field of the same name, never to a member of the struct identity (ESS-SYNTH-005 on
  # PutSecret, RevokeOwnedSecret and both Secret transitions; ESS 0.52.0, 2026-10-05;
  # beyond10x/ess#428), so the filter is left undeclared.
  - name: secrets.custody.NamespaceSecrets
    source: secrets.custody.Secret
    consistency: read_your_writes
    fields: *metadata

# Not declared: /health/live, /health/ready (crates/secrets-http/src/lib.rs:62-71), /metrics,
# /openapi.json and /docs (crates/secrets-http/src/lib.rs:72-84) read no entity. `secrets migrate`
# (crates/secrets-app/src/main.rs:19, 65-67) changes the schema, not the domain.

components:
  # crates/secrets-app/src/main.rs:84-105 `secrets serve`, axum on SECRETS_BIND.
  - component: secrets-service
    summary: Encrypted secret custody over HTTP, plus the rewrap operator command.
    owns:
      domains:
        - secrets.custody
    accepts:
      commands:
        - secrets.custody.PutSecret
        - secrets.custody.RevokeOwnedSecret
        - secrets.custody.DeleteOwnedSecret
        - secrets.custody.DeleteSecret
        - secrets.custody.PrepareTransaction
        - secrets.custody.CommitTransaction
        - secrets.custody.AbortTransaction
        - secrets.custody.RewrapSecrets
        - secrets.custody.ReadSecretValue
        - secrets.custody.CheckSecretExists
        - secrets.custody.ListNamespaceSecrets
    # publishes: nothing; the service publishes no events (see the file header).
    reached_by: network
