# validate_ref counts bytes with `str::len` (crates/secrets-postgres/src/lib.rs:439): 200 characters
# of U+00E9 are 400 bytes, over the 255-byte bound, so the put is the external `invalid-reference`
# of spec/domains/custody.yaml even though `.count` reads 200.
