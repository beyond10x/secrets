# SecretMetadata.created_at / updated_at (crates/secrets-core/src/lib.rs:75-86), read as created_at::text
# (crates/secrets-postgres/src/lib.rs:166, 260, 398-435); docs/openapi.json Metadata omits both.
type: ess-scenario/1
domain: secrets.custody
scenario: secret-metadata-carries-its-timestamps
summary: Secret metadata carries created_at and updated_at, which the OpenAPI Metadata schema omits.
timeline:
- at: '2026-09-27T12:00:00Z'
  command: secrets.custody.PutSecret
  actor: secrets.custody.Workload
  input:
    reference: {tenant: tenant-a, namespace: connectors, key: dated-token}
    owner_subject: user-a
    value: ZGF0ZWQ=
  outcome: created
assert:
- view: secrets.custody.NamespaceSecrets
  satisfies: {all: ['created_at != ""', 'updated_at != ""']}
- view: secrets.custody.OwnedSecrets
  satisfies: {all: ['created_at != ""', 'updated_at != ""']}
