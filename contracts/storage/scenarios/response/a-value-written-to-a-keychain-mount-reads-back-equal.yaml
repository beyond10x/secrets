# story:read-response-scenarios, "a value written to a keychain mount reads back equal". Namespace
# `default` is local mode's keychain mount (the runner's mock keyring store). `Read.read` declares
# `returns: true`, so each read asserts the returned `value` literally: the bytes the write before
# it stored, the second time binary and after a replace, so a backend that returns other bytes or
# the earlier value fails here. `version` is generated by the backend and is not asserted.
type: ess-scenario/4
domain: secrets.storage
scenario: a-value-written-to-a-keychain-mount-reads-back-equal
summary: A value written to the keychain, and the value that replaces it, each read back byte for byte.
timeline:
- at: '2026-10-05T16:00:00Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
- at: '2026-10-05T16:00:01Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: read
  response:
    value: c2VjcmV0
- at: '2026-10-05T16:00:02Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: AP/+CmtleQ==
  outcome: replaced
- at: '2026-10-05T16:00:03Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: read
  response:
    value: AP/+CmtleQ==
