# story:local-authorizer, "a second user is denied by name before any backend is reached", in the
# admitted tenant `default`. The runner reads `denied-user` only when the call reached no backend
# and did not consult the namespace configuration store. The namespace commands name no user, so
# only the commands that address a scope are here.
type: ess-scenario/1
domain: secrets.storage
scenario: a-second-user-is-denied-before-any-backend
summary: Every storage command for user alice in tenant default is denied, even with a name the port would refuse.
timeline:
- at: '2026-10-05T16:20:00Z'
  command: secrets.storage.Bind
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
    locator: op://Work/OpenAI/credential
  outcome: denied-user
  error:
    name: secrets.storage.Denied
  no_events: [secrets.storage.NameBound]
- at: '2026-10-05T16:20:01Z'
  command: secrets.storage.Unbind
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
  outcome: denied-user
  error:
    name: secrets.storage.Denied
- at: '2026-10-05T16:20:02Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
    value: c2VjcmV0
  outcome: denied-user
  error:
    name: secrets.storage.Denied
  no_events: [secrets.storage.SecretWritten]
- at: '2026-10-05T16:20:03Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
  outcome: denied-user
  error:
    name: secrets.storage.Denied
- at: '2026-10-05T16:20:04Z'
  command: secrets.storage.Delete
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
  outcome: denied-user
  error:
    name: secrets.storage.Denied
- at: '2026-10-05T16:20:05Z'
  command: secrets.storage.Rename
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
    new_name: openai-work
  outcome: denied-user
  error:
    name: secrets.storage.Denied
- at: '2026-10-05T16:20:06Z'
  command: secrets.storage.ListMetadata
  actor: secrets.storage.LocalUser
  input:
    scope: {tenant: default, namespace: default, user: alice}
  outcome: denied-user
  error:
    name: secrets.storage.Denied
- at: '2026-10-05T16:20:07Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    value: c2VjcmV0
  outcome: denied-user
  error:
    name: secrets.storage.Denied
assert:
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: alice}
      name: openai
