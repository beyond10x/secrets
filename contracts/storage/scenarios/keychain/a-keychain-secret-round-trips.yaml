# story:keychain-backend, "read, write, delete and list round trips", in namespace `default`, which
# local mode mounts on the keychain backend (the runner's mock keyring store). Every `not-found` and
# `created` here is forced, and the runner refuses to arrange either while the keychain still holds
# the secret, so a delete or rename that leaves the entry behind fails this scenario. That a read
# returns the bytes written is asserted by
# `response/a-value-written-to-a-keychain-mount-reads-back-equal`, with the Rust test
# `a_written_value_reads_back_and_is_listed_with_its_version` kept.
type: ess-scenario/1
domain: secrets.storage
scenario: a-keychain-secret-round-trips
summary: A secret written to the keychain is replaced, read, listed, renamed and deleted, and is gone afterwards.
timeline:
- at: '2026-10-05T13:00:00Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
  events:
  - event: secrets.storage.SecretWritten
    payload:
      address:
        scope: {tenant: default, namespace: default, user: default}
        name: openai
- at: '2026-10-05T13:00:01Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0LTI=
  outcome: replaced
- at: '2026-10-05T13:00:02Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: read
- at: '2026-10-05T13:00:03Z'
  command: secrets.storage.ListMetadata
  actor: secrets.storage.LocalUser
  input:
    scope: {tenant: default, namespace: default, user: default}
  outcome: listed
- at: '2026-10-05T13:00:04Z'
  command: secrets.storage.Rename
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    new_name: openai-work
  outcome: renamed
- at: '2026-10-05T13:00:05Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: not-found
  error:
    name: secrets.storage.NotFound
- at: '2026-10-05T13:00:06Z'
  command: secrets.storage.Delete
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai-work
  outcome: deleted
- at: '2026-10-05T13:00:07Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai-work
  outcome: not-found
  error:
    name: secrets.storage.NotFound
- at: '2026-10-05T13:00:08Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: team/anthropic
    value: c2VjcmV0
  outcome: created
assert:
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: team/anthropic
    state: Stored
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai-work
