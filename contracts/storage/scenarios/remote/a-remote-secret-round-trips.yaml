# story:remote-backend, "read, write, delete and list round trips through `secrets-client`". The
# runner mounts `remote/custody` as the remote backend over an in-process custody service (the
# shipped router and PostgreSQL store, on a loopback port). Every `not-found` and `created` here is
# forced, and the runner refuses to arrange either while custody still holds the secret. That a
# read returns the bytes written is asserted by
# `response/a-value-written-to-a-remote-mount-reads-back-equal`, with the Rust test
# `crates/secrets-remote/tests/round_trips.rs` kept. How an address maps to a custody reference is
# not claimable in this domain; `an_address_maps_to_the_user_prefixed_key_and_back` and
# `mapping.rs` guard it.
type: ess-scenario/1
domain: secrets.storage
scenario: a-remote-secret-round-trips
summary: A namespace mounted on the custody service stores, replaces, reads, lists, renames and deletes a secret.
timeline:
- at: '2026-10-05T14:00:00Z'
  command: secrets.storage.AddNamespace
  actor: secrets.storage.LocalUser
  input:
    namespace: {tenant: default, namespace: vault}
    mount: {kind: remote, label: custody}
  outcome: added
- at: '2026-10-05T14:00:01Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
  events:
  - event: secrets.storage.SecretWritten
    payload:
      address:
        scope: {tenant: default, namespace: vault, user: default}
        name: openai
- at: '2026-10-05T14:00:02Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: openai
    value: c2VjcmV0LTI=
  outcome: replaced
- at: '2026-10-05T14:00:03Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: openai
  outcome: read
- at: '2026-10-05T14:00:04Z'
  command: secrets.storage.ListMetadata
  actor: secrets.storage.LocalUser
  input:
    scope: {tenant: default, namespace: vault, user: default}
  outcome: listed
- at: '2026-10-05T14:00:05Z'
  command: secrets.storage.Rename
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: openai
    new_name: team/openai
  outcome: renamed
- at: '2026-10-05T14:00:06Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: openai
  outcome: not-found
  error:
    name: secrets.storage.NotFound
- at: '2026-10-05T14:00:07Z'
  command: secrets.storage.Delete
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: team/openai
  outcome: deleted
- at: '2026-10-05T14:00:08Z'
  command: secrets.storage.Read
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: team/openai
  outcome: not-found
  error:
    name: secrets.storage.NotFound
- at: '2026-10-05T14:00:09Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: anthropic
    value: c2VjcmV0
  outcome: created
assert:
- view: secrets.storage.Namespaces
  contains:
    namespace: {tenant: default, namespace: vault}
    mount: {kind: remote, label: custody}
    state: Present
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: anthropic
    state: Stored
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: openai
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: vault, user: default}
      name: team/openai
