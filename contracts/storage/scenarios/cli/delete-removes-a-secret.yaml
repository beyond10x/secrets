# story:local-cli, `delete`. The second delete's `not-found` is forced, and the runner refuses to
# arrange it while the store still holds the name, so a delete that leaves the entry behind fails
# this scenario.
type: ess-scenario/1
domain: secrets.storage
scenario: delete-removes-a-secret
summary: Delete removes a secret, and deleting it again is not-found.
timeline:
- at: '2026-10-05T16:03:00Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
- at: '2026-10-05T16:03:01Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: anthropic
    value: c2VjcmV0
  outcome: created
- at: '2026-10-05T16:03:02Z'
  command: secrets.storage.Delete
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: deleted
  events:
  - event: secrets.storage.SecretDeleted
    payload:
      address:
        scope: {tenant: default, namespace: default, user: default}
        name: openai
- at: '2026-10-05T16:03:03Z'
  command: secrets.storage.Delete
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: not-found
  error:
    name: secrets.storage.NotFound
  no_events: [secrets.storage.SecretDeleted]
assert:
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: anthropic
