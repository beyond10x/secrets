# story:local-cli, `describe`. No command of the specification describes one secret (the
# DEFERRED note above `commands`); describe is the SecretMetadata row of one name. The CLI target
# reads the SecretMetadata view with `secretsctl list --json` and checks every listed row against
# `secretsctl describe --json` for its name, so each assertion below also holds describe to the
# listing: a describe that shows another scope, backend or version fails the read.
type: ess-scenario/1
domain: secrets.storage
scenario: describe-shows-the-name-scope-and-version-of-a-secret
summary: Describe shows a secret's name, scope and version, the same row the listing holds, in any namespace.
timeline:
- at: '2026-10-05T16:01:00Z'
  command: secrets.storage.AddNamespace
  actor: secrets.storage.LocalUser
  input:
    namespace: {tenant: default, namespace: work}
  outcome: added
- at: '2026-10-05T16:01:01Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
- at: '2026-10-05T16:01:02Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: work, user: default}
      name: team/openai
    value: c2VjcmV0
  outcome: created
assert:
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    state: Stored
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: work, user: default}
      name: team/openai
    state: Stored
