# story:local-cli, `rename`. The second rename's `not-found` is forced, and the runner refuses to
# arrange it while the store still holds the old name, so a rename that copies without removing
# fails this scenario.
type: ess-scenario/1
domain: secrets.storage
scenario: rename-moves-a-secret-to-a-new-name
summary: Rename moves a secret to a new name in its namespace, and the old name holds nothing afterwards.
timeline:
- at: '2026-10-05T16:04:00Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
- at: '2026-10-05T16:04:01Z'
  command: secrets.storage.Rename
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    new_name: openai-work
  outcome: renamed
  events:
  - event: secrets.storage.SecretRenamed
    payload:
      address:
        scope: {tenant: default, namespace: default, user: default}
        name: openai
      new_name: openai-work
- at: '2026-10-05T16:04:02Z'
  command: secrets.storage.Rename
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    new_name: openai-other
  outcome: not-found
  error:
    name: secrets.storage.NotFound
  no_events: [secrets.storage.SecretRenamed]
assert:
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai-work
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai-other
