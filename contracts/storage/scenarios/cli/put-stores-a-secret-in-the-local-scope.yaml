# story:local-cli, `put`. Through the CLI target each Write is `secretsctl put` with the value on a
# pipe, and `created` or `replaced` is what the binary printed; `created` is forced, and the
# runner refuses to arrange it while the store already holds the name. That the value never
# reaches stdout or stderr, and that a value in argv is refused, are not claimable here; the Rust
# tests `no_command_writes_secret_bytes_to_stdout_or_stderr` and
# `put_refuses_a_value_in_argv_and_stores_nothing` in `crates/secretsctl/tests/cli.rs` guard them.
type: ess-scenario/1
domain: secrets.storage
scenario: put-stores-a-secret-in-the-local-scope
summary: Put stores a value under a name in tenant and user default, and a second put of the name replaces it.
timeline:
- at: '2026-10-05T16:00:00Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
  events:
  - event: secrets.storage.SecretWritten
    payload:
      address:
        scope: {tenant: default, namespace: default, user: default}
        name: openai
- at: '2026-10-05T16:00:01Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0LTI=
  outcome: replaced
- at: '2026-10-05T16:00:02Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: team/openai
    value: c2VjcmV0
  outcome: created
assert:
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    state: Stored
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: team/openai
    state: Stored
