# story:local-cli, `list`. Through the CLI target ListMetadata is `secretsctl list --json`, and so
# is every read of the SecretMetadata view, one namespace at a time. A command outcome cannot
# restrict a view to its input (ESS-LIMIT #36), so that a listing holds exactly its namespace's
# rows is guarded by the federation test `a_backend_row_for_another_scope_is_dropped_from_a_listing`.
type: ess-scenario/1
domain: secrets.storage
scenario: list-reads-the-secrets-of-a-namespace
summary: List reads the names of a namespace's secrets, and each namespace's secrets stay in it.
timeline:
- at: '2026-10-05T16:02:00Z'
  command: secrets.storage.AddNamespace
  actor: secrets.storage.LocalUser
  input:
    namespace: {tenant: default, namespace: work}
  outcome: added
- at: '2026-10-05T16:02:01Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: ZGVmYXVsdA==
  outcome: created
- at: '2026-10-05T16:02:02Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: work, user: default}
      name: openai
    value: d29yaw==
  outcome: created
- at: '2026-10-05T16:02:03Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: work, user: default}
      name: anthropic
    value: d29yaw==
  outcome: created
- at: '2026-10-05T16:02:04Z'
  command: secrets.storage.ListMetadata
  actor: secrets.storage.LocalUser
  input:
    scope: {tenant: default, namespace: work, user: default}
  outcome: listed
  events:
  - event: secrets.storage.MetadataListed
    payload:
      scope: {tenant: default, namespace: work, user: default}
assert:
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: work, user: default}
      name: openai
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: work, user: default}
      name: anthropic
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
- view: secrets.storage.SecretMetadata
  excludes:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: anthropic
