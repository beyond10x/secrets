# story:local-cli, `unbind`. The second unbind's `not-found` is forced and adds nothing. The
# rename after it is unforced and arranges no binding, so it passes only if the unbind removed
# the one it addressed: renaming a bound name is a conflict.
type: ess-scenario/1
domain: secrets.storage
scenario: unbind-removes-a-binding
summary: Unbind removes a name's binding, unbinding it again is not-found, and the name can then be renamed.
timeline:
- at: '2026-10-05T16:10:00Z'
  command: secrets.storage.Bind
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    locator: op://Work/OpenAI/credential
  outcome: bound
- at: '2026-10-05T16:10:01Z'
  command: secrets.storage.Unbind
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: unbound
  events:
  - event: secrets.storage.NameUnbound
    payload:
      address:
        scope: {tenant: default, namespace: default, user: default}
        name: openai
- at: '2026-10-05T16:10:02Z'
  command: secrets.storage.Unbind
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
  outcome: not-found
  error:
    name: secrets.storage.NotFound
  no_events: [secrets.storage.NameUnbound]
- at: '2026-10-05T16:10:03Z'
  command: secrets.storage.Write
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    value: c2VjcmV0
  outcome: created
- at: '2026-10-05T16:10:04Z'
  command: secrets.storage.Rename
  actor: secrets.storage.LocalUser
  input:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai
    new_name: openai-work
  outcome: renamed
assert:
- view: secrets.storage.SecretMetadata
  contains:
    address:
      scope: {tenant: default, namespace: default, user: default}
      name: openai-work
